version: "3.8"

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow
    ports:
      - "5001:5000"
    command: mlflow server --host 0.0.0.0 --port 5000

  fraud-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow